name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      git_ref:
        description: 'Git ref to release from'
        required: true
        default: main
        type: string

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      MIX_ENV: test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Resolve release commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-verify-${{ hashFiles('**/mix.lock', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-mix-verify-
            ${{ runner.os }}-mix-

      - name: Install Elixir dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Install JavaScript dependencies
        run: mix npm.ci

      - name: Run hook tests
        run: mix npm.run test:hooks

      - name: Check TypeScript
        run: mix npm.run typecheck

      - name: Check code formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Build production assets
        working-directory: apps/synapsis_web
        env:
          MIX_ENV: prod
          SECRET_KEY_BASE: build-only-placeholder-key-that-is-at-least-64-bytes-long-for-phoenix
          SYNAPSIS_ENCRYPTION_KEY: build-only-encryption-key-32bytes
        run: mix assets.deploy

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    env:
      MIX_ENV: prod
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-amd64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-prod-${{ hashFiles('**/mix.lock', 'package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-mix-prod-

      - name: Set version in mix.exs files
        run: |
          for file in mix.exs apps/*/mix.exs; do
            awk 'BEGIN { version = "${{ inputs.version }}" } $1 == "@version" { print "  @version \"" version "\""; next } { print }' "$file" > "$file.tmp"
            mv "$file.tmp" "$file"
          done

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod

      - name: Install JavaScript dependencies
        run: mix npm.ci

      - name: Build production assets
        working-directory: apps/synapsis_web
        env:
          SECRET_KEY_BASE: build-only-placeholder-key-that-is-at-least-64-bytes-long-for-phoenix
          SYNAPSIS_ENCRYPTION_KEY: build-only-encryption-key-32bytes
        run: mix assets.deploy

      - name: Compile
        run: mix compile

      - name: Remove stale release archives
        run: rm -f _build/prod/synapsis-*.tar.gz

      - name: Build OTP release
        run: mix release synapsis
        env:
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || 'build-only-placeholder-key-that-is-at-least-64-bytes-long-for-phoenix' }}

      - name: Rename release archive
        run: |
          mv "_build/prod/synapsis-${{ inputs.version }}.tar.gz" \
            "_build/prod/synapsis-${{ inputs.version }}-${{ matrix.target }}.tar.gz"

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapsis-${{ inputs.version }}-${{ matrix.target }}
          path: _build/prod/synapsis-${{ inputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  smoke:
    name: Installed Linux Smoke
    needs: [verify, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux archive
        uses: actions/download-artifact@v4
        with:
          name: synapsis-${{ inputs.version }}-linux-amd64
          path: dist

      - name: Boot installed release on loopback
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          smoke_root="$RUNNER_TEMP/synapsis-smoke"
          release_root="$smoke_root/release"
          mkdir -p "$release_root" "$smoke_root/config" "$smoke_root/concord" "$smoke_root/memory" "$smoke_root/workspace"
          tar -xzf "dist/synapsis-${RELEASE_VERSION}-linux-amd64.tar.gz" -C "$release_root"

          test "$("$release_root/bin/synapsis" version)" = "synapsis ${RELEASE_VERSION}"

          release_manifest="$release_root/releases/${RELEASE_VERSION}/synapsis.rel"
          for app in synapsis_data synapsis_agent synapsis_provider synapsis_core synapsis_server synapsis_workspace synapsis_web synapsis_mcp synapsis_sandbox; do
            grep -Fq "{${app},\"${RELEASE_VERSION}\",permanent}" "$release_manifest"
          done

          export PHX_HOST=localhost
          export PORT=4664
          export SECRET_KEY_BASE=0123456789012345678901234567890123456789012345678901234567890123
          export SYNAPSIS_ENCRYPTION_KEY=01234567890123456789012345678901
          export SYNAPSIS_CONFIG_DIR="$smoke_root/config"
          export SYNAPSIS_CONCORD_DATA_DIR="$smoke_root/concord"
          export SYNAPSIS_MEMORY_DIR="$smoke_root/memory"
          export SYNAPSIS_WORKSPACE_ROOT="$smoke_root/workspace"
          unset PHX_IP

          "$release_root/bin/synapsis" start >"$smoke_root/release.log" 2>&1 &
          release_pid=$!
          cleanup() {
            kill -TERM "$release_pid" 2>/dev/null || true
            wait "$release_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4664/api/health >"$smoke_root/health.json"; then
              break
            fi
            if ! kill -0 "$release_pid" 2>/dev/null; then
              cat "$smoke_root/release.log"
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:4664/api/health >"$smoke_root/health.json"
          jq -e --arg version "$RELEASE_VERSION" '.ok == true and .version == $version' "$smoke_root/health.json"

          listen_address="$(ss -H -ltn 'sport = :4664' | awk 'NR == 1 { print $4 }')"
          test "$listen_address" = "127.0.0.1:4664"

          curl --fail --silent --show-error \
            -X POST http://127.0.0.1:4664/api/sessions \
            -H 'content-type: application/json' \
            --data '{"title":"Release smoke"}' \
            >"$smoke_root/session.json"
          jq -e '.data.id | type == "string" and length > 0' "$smoke_root/session.json"

  release:
    name: Publish Release
    needs: [verify, build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: synapsis-${{ inputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Synapsis v${{ inputs.version }}
          generate_release_notes: true
          files: |
            dist/synapsis-${{ inputs.version }}-*.tar.gz
            rel/service/com.gsmlg.synapsis.plist
            rel/service/synapsis.service
            rel/service/synapsis.env.example
            rel/service/INSTALL.md
