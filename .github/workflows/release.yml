name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      git_ref:
        description: 'Git ref to release from'
        required: true
        default: main
        type: string

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

env:
  MIX_ENV: prod
  PGUSER: postgres
  PGPASSWORD: postgres
  PGHOST: localhost
  PGPORT: 5432

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-amd64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-prod-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-mix-prod-

      - name: Set version in mix.exs files
        run: |
          perl -pi -e 's/@version ".*"/@version "${{ inputs.version }}"/' mix.exs apps/*/mix.exs

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod

      - name: Compile
        run: mix compile

      - name: Remove stale release archives
        run: rm -f _build/prod/synapsis-*.tar.gz

      - name: Build OTP release
        run: mix release synapsis
        env:
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || 'build-only-placeholder-key-that-is-at-least-64-bytes-long-for-phoenix' }}

      - name: Rename release archive
        run: |
          mv "_build/prod/synapsis-${{ inputs.version }}.tar.gz" \
            "_build/prod/synapsis-${{ inputs.version }}-${{ matrix.target }}.tar.gz"

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapsis-${{ inputs.version }}-${{ matrix.target }}
          path: _build/prod/synapsis-${{ inputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: synapsis-${{ inputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Synapsis v${{ inputs.version }}
          generate_release_notes: true
          files: |
            dist/synapsis-${{ inputs.version }}-*.tar.gz
            rel/service/com.gsmlg.synapsis.plist
            rel/service/synapsis.service
            rel/service/synapsis.env.example
            rel/service/INSTALL.md
