name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      git_ref:
        description: 'Git ref to release from'
        required: true
        default: main
        type: string

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      MIX_ENV: test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Resolve release commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-verify-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-verify-
            ${{ runner.os }}-mix-

      - name: Install Elixir dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Install JavaScript dependencies
        run: bun install

      - name: Run hook tests
        run: bun test packages/hooks/test

      - name: Check TypeScript
        run: |
          bun x tsc --noEmit -p apps/synapsis_web/tsconfig.json
          bun x tsc --noEmit -p packages/hooks/tsconfig.json

      - name: Check code formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Build production assets
        working-directory: apps/synapsis_web
        env:
          MIX_ENV: prod
          SECRET_KEY_BASE: build-only-placeholder-key-that-is-at-least-64-bytes-long-for-phoenix
          SYNAPSIS_ENCRYPTION_KEY: build-only-encryption-key-32bytes
        run: |
          mix assets.setup
          mix assets.deploy

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    env:
      MIX_ENV: prod
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-amd64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-prod-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-mix-prod-

      - name: Set version in mix.exs files
        run: |
          for file in mix.exs apps/*/mix.exs; do
            awk 'BEGIN { version = "${{ inputs.version }}" } $1 == "@version" { print "  @version \"" version "\""; next } { print }' "$file" > "$file.tmp"
            mv "$file.tmp" "$file"
          done

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod

      - name: Install JavaScript dependencies
        run: bun install

      - name: Build production assets
        working-directory: apps/synapsis_web
        env:
          SECRET_KEY_BASE: build-only-placeholder-key-that-is-at-least-64-bytes-long-for-phoenix
          SYNAPSIS_ENCRYPTION_KEY: build-only-encryption-key-32bytes
        run: |
          mix assets.setup
          mix assets.deploy

      - name: Compile
        run: mix compile

      - name: Remove stale release archives
        run: rm -f _build/prod/synapsis-*.tar.gz

      - name: Build OTP release
        run: mix release synapsis
        env:
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || 'build-only-placeholder-key-that-is-at-least-64-bytes-long-for-phoenix' }}

      - name: Rename release archive
        run: |
          mv "_build/prod/synapsis-${{ inputs.version }}.tar.gz" \
            "_build/prod/synapsis-${{ inputs.version }}-${{ matrix.target }}.tar.gz"

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapsis-${{ inputs.version }}-${{ matrix.target }}
          path: _build/prod/synapsis-${{ inputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: synapsis-${{ inputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Synapsis v${{ inputs.version }}
          generate_release_notes: true
          files: |
            dist/synapsis-${{ inputs.version }}-*.tar.gz
            rel/service/com.gsmlg.synapsis.plist
            rel/service/synapsis.service
            rel/service/synapsis.env.example
            rel/service/INSTALL.md
